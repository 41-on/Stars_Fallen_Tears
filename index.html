<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별이 내린 눈물</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================================== -->
    <!-- 1. 첫 화면 -->
    <!-- ================================================== -->

    <main class="landing screen" id="home-screen">

        <img class="landing-background" src="cover.jpg" alt="">

        <div class="landing-content">

            <h1 class="game-title">
                별이 내린 눈물
            </h1>

            <p class="landing-notice">
                엔딩페이지입니다.<br>
                엔딩 단계에서만 확인하세요.
            </p>

            <button
    class="ending-button"
    id="start-ending"
    type="button"
>
    엔딩 보기
</button>

        </div>

    </main>


    <!-- ================================================== -->
    <!-- 2. 범인 선택 화면 -->
    <!-- ================================================== -->

    <main class="selection-screen screen" id="culprit-screen" hidden>

        <section class="book-page">

            <header class="selection-header">

                <p class="section-label">THE FINAL VOTE</p>

                <h1>범인은 누구인가?</h1>

                <p>
                    투표에서 범인으로 최다 득표한 인물을 선택하세요.
                </p>

            </header>


            <div class="character-grid">

                <button class="character-card" type="button" data-character="A">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">빌헬름</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

                <button class="character-card" type="button" data-character="B">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">율리안</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

                <button class="character-card" type="button" data-character="C">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">힐데</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

                <button class="character-card" type="button" data-character="D">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">하인리히</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

                <button class="character-card" type="button" data-character="E">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">알베르트</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

                <button class="character-card" type="button" data-character="F">
                    <span class="portrait-placeholder" aria-hidden="true">
                        초상화
                    </span>
                    <span class="character-name">에밀</span>
                    <span class="card-decoration">— ❖ —</span>
                </button>

            </div>


            <footer class="selection-footer">

                <button class="back-button" id="back-home" type="button">
                    ← 처음으로
                </button>

            </footer>

        </section>

    </main>
    
<!-- 3. 에밀의 아이템 획득 여부 -->
<main class="choice-screen screen" id="item-screen" hidden>
    <section class="book-page choice-page">
        <header class="selection-header">
            <p class="section-label">ENDING</p>
            <h1>기밀 문서 소지 여부</h1>
            <p>에밀이 기밀 문서 2개를 소지하고 있습니까?</p>
        </header>
        <div class="choice-content">
            <button class="ending-button" id="item-yes" type="button">
                소지하고 있다
            </button>
            <button class="ending-button" id="item-no" type="button">
                소지하지 못했다
            </button>
            <footer class="selection-footer">
            <button class="back-button" id="back-to-culprits-from-item" type="button">
                ← 범인 선택으로 돌아가기
            </button>
            </footer>
        </div>
    </section>
</main>

<!-- 4. 단서 공개 여부 -->
<main class="choice-screen screen" id="clue-screen" hidden>
    <section class="book-page choice-page">
        <header class="selection-header">
            <p class="section-label">ENDING CONDITIONS</p>
            <h1>단서 공개 여부</h1>
            <p>공개된 단서를 선택해 주세요.</p>
        </header>
        <div class="choice-content">
            <label>
                <input type="checkbox" id="clue-one">
                첫 번째 단서 공개
            </label>
            <footer class="selection-footer">
            <label>
                <input type="checkbox" id="clue-two">
                두 번째 단서 공개
            </label>
            </footer>
            <footer class="selection-footer">
            <button class="ending-button" id="confirm-clues" type="button">
                다음
            </button>
            <button class="back-button" id="back-to-item" type="button">
                ← 이전
            </button>
            </footer>
        </div>
    </section>
</main>

<!-- 5. 알베르트의 포박 대상 -->
<main class="choice-screen screen" id="restraint-screen" hidden>
    <section class="book-page choice-page">
        <header class="selection-header">
            <p class="section-label">ENDING CONDITIONS</p>
            <h1>포박 여부</h1>
            <p>알베르트가 유대인 중<br>
               누구를 포박했습니까?</p>
        </header>
        <div class="choice-content">
            <button class="ending-button restraint-option"
                data-restraint="julian" type="button">
                율리안을 포박했다
            </button>
            <button class="ending-button restraint-option"
                data-restraint="hilde" type="button">
                힐데를 포박했다
            </button>
            <button class="ending-button restraint-option"
                data-restraint="none" type="button">
                포박하지 않았다
            </button>
            <footer class="selection-footer">
            <button class="back-button" id="back-to-clues" type="button">
                ← 이전
            </button>
            </footer>
        </div>
    </section>
</main>

<!-- 6. 엔딩 결과 -->
<main class="choice-screen screen" id="ending-screen" hidden>
    <section class="book-page choice-page">
        <header class="selection-header">
            <p class="section-label">THE END</p>
            <h1 id="ending-title">당신들의 끝</h1>
        </header>
        <div class="choice-content">
            <p id="ending-description"></p>
            <button
                class="ending-button"
                id="go-to-epilogue"
                type="button"
            >
                에필로그
            </button>
            <footer class="selection-footer">
            <button
                class="back-button"
                id="finish-game"
                type="button"
            >
                처음으로
            </button>
            </footer>
        </div>
    </section>
</main>

<!-- 8. 에필로그 -->
<main class="choice-screen screen" id="epilogue-screen" hidden>
    <section class="book-page choice-page">
        <header class="selection-header">
            <p class="section-label">EPILOGUE</p>
            <h1 id="epilogue-title">에필로그</h1>
        </header>
        <div class="choice-content">
            <div id="epilogue-character-buttons">
                <button
                    class="ending-button epilogue-character"
                    data-character="wilhelm"
                    type="button"
                >
                    빌헬름
                </button>
                <button
                    class="ending-button epilogue-character"
                    data-character="julian"
                    type="button"
                >
                    율리안
                </button>
                <button
                    class="ending-button epilogue-character"
                    data-character="hilde"
                    type="button"
                >
                    힐데
                </button>
                <button
                    class="ending-button epilogue-character"
                    data-character="heinrich"
                    type="button"
                >                    
                    하인리히
                </button>
                <button
                    class="ending-button epilogue-character"
                    data-character="albert"
                    type="button"
                >
                    알베르트
                </button>
                <button
                    class="ending-button epilogue-character"
                    data-character="emil"
                    type="button"
                >
                    에밀
                </button>
                
            </div>
            <div id="epilogue-text"></div>
            <button class="back-button" id="finish-epilogue" type="button">
    처음으로
</button>
        </div>
    </section>
</main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
